<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>友情链接</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    body{background:#f5f7fa;padding:30px;max-width:1200px;margin:0 auto}
    h1{text-align:center;margin-bottom:40px;color:#222}
    .link-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
    .link-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 12px #00000010;display:flex;gap:14px;align-items:center}
    .avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #eee}
    .info h3{font-size:17px;color:#111;margin-bottom:6px}
    .info p{font-size:13px;color:#666;line-height:1.5}
    .info a{text-decoration:none;color:#3b82f6}
  </style>
</head>
<body>
<h1>我的友情链接</h1>
<div class="link-wrap" id="container"></div>

<script>
// 异步加载同目录下 links.json
fetch('./friends.json')
.then(res=>res.json())
.then(list=>{
  const box=document.getElementById('container')
  list.forEach(item=>{
    box.innerHTML += `
      <div class="link-card">
        <img class="avatar" src="${item.avatar}" alt="${item.name}头像">
        <div class="info">
          <h3><a href="${item.url}" target="_blank">${item.name}</a></h3>
          <p>${item.description}</p>
        </div>
      </div>
    `
  })
})
.catch(err=>{
  document.getElementById('container').innerHTML='友链数据加载失败，请检查json路径'
  console.error(err)
})
</script>
</body>
</html>
