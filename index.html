<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友情链接</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    /* 主题变量 - 浅色默认 */
    :root {
      --body-bg: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-sub: #666666;
      --border-color: #eeeeee;
      --link-color: #3b82f6;
      --btn-bg: #ffffff;
      --btn-text: #333;
      --btn-active: #3b82f6;
      --btn-active-text: #fff;
      --shadow: 0 2px 12px #00000010;
      --input-bg: #fff;
      /* 选中状态变量（悬浮生效） */
      --card-selected-border: #3b82f6;
      --card-selected-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2), 0 8px 24px rgba(59, 130, 246, 0.15);
    }

    /* 系统自动深色模式 */
    @media (prefers-color-scheme: dark) {
      :root {
        --body-bg: #121218;
        --card-bg: #1e1e2f;
        --text-main: #f0f0f0;
        --text-sub: #b0b0c0;
        --border-color: #333344;
        --shadow: 0 2px 12px #00000040;
        --input-bg: #2a2a3f;
        --card-selected-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3), 0 8px 24px rgba(59, 130, 246, 0.2);
      }
    }

    /* 手动深色主题类 */
    html.dark {
      --body-bg: #121218;
      --card-bg: #1e1e2f;
      --text-main: #f0f0f0;
      --text-sub: #b0b0c0;
      --border-color: #333344;
      --shadow: 0 2px 12px #00000040;
      --input-bg: #2a2a3f;
      --card-selected-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3), 0 8px 24px rgba(59, 130, 246, 0.2);
    }

    body{
      background: var(--body-bg);
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
      transition: background 0.3s ease;
    }
    h1{
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    /* 工具栏 */
    .tool-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .tool-bar button {
      padding: 6px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      transition: 0.2s;
    }
    .tool-bar button.active {
      background: var(--btn-active);
      color: var(--btn-active-text);
      border-color: var(--btn-active);
    }

    /* 友链容器 + 三种布局模式 */
    .link-wrap {
      gap: 20px;
      margin-bottom: 40px;
    }
    .link-wrap.grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
    }
    .link-wrap.list {
      display: flex;
      flex-direction: column;
    }
    .link-wrap.compact {
      display: flex;
      flex-wrap: wrap;
    }

    /* 友链卡片 基础样式（默认无选中效果） */
    .link-card{
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 14px;
      align-items: center;
      transition: all 0.3s ease;
      cursor: pointer;
      /* 默认状态：无高亮、无上移 */
      border-color: var(--border-color);
      transform: translateY(0);
    }
    html.dark .link-card {
      background: rgba(30, 30, 47, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-color: var(--border-color);
    }

    /* 鼠标悬浮 = 选中状态 + 动态效果 */
    .link-card:hover {
      border-color: var(--card-selected-border);
      box-shadow: var(--card-selected-shadow);
      transform: translateY(-4px);
    }

    /* 鼠标点击按压效果 */
    .link-card:active {
      transform: translateY(-2px);
      transition: all 0.1s ease;
    }

    /* 悬浮时头像放大 */
    .link-card:hover .avatar {
      border-color: var(--card-selected-border);
      transform: scale(1.05);
    }

    /* 悬浮时标题变色 */
    .link-card:hover .info h3 {
      color: var(--btn-active);
    }

    .avatar{
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .info h3{
      font-size: 17px;
      color: var(--text-main);
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .info p{
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
    }
    .info a{
      text-decoration: none;
      color: var(--link-color);
      transition: all 0.2s ease;
    }
    .info a:hover {
      color: #2563eb;
      text-decoration: underline;
    }

    /* 分页 */
    .pagination {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 36px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
    }
    .page-btn.active {
      background: var(--btn-active);
      color: #fff;
      border-color: var(--btn-active);
    }

    /* 模式图标 */
    .mode-btn {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mode-icon {
      width: 16px;
      height: 16px;
      display: inline-block;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    .icon-grid { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>'); }
    .icon-list { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>'); }
    .icon-compact { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><circle cx="10" cy="13" r="2"></circle><path d="m20 17-1.09-1.09a2 2 0 0 0-2.82 0L10 22"></path></svg>'); }
    html.dark .mode-icon {
      filter: invert(1);
    }

    /* 🔗 自助申请按钮 */
    .apply-btn {
      margin: 0 auto 30px;
      display: block;
      padding: 12px 36px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: var(--btn-active);
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .apply-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.45);
    }
    .apply-btn:active {
      transform: translateY(0);
    }

    /* 申请友链弹窗 毛玻璃弹窗 */
    .mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .apply-box {
      width: 90%;
      max-width: 500px;
      padding: 24px;
      border-radius: 16px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    html.dark .apply-box {
      background: rgba(30,30,47,0.85);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .apply-box h2 {
      text-align: center;
      color: var(--text-main);
      margin-bottom: 20px;
      font-size: 20px;
    }
    .form-item {
      margin-bottom: 16px;
    }
    .form-item label {
      display: block;
      color: var(--text-main);
      margin-bottom: 6px;
      font-size: 14px;
    }
    .form-item input,
    .form-item textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text-main);
      outline: none;
      transition: 0.2s;
    }
    .form-item input:focus,
    .form-item textarea:focus {
      border-color: var(--btn-active);
    }
    .form-item textarea {
      min-height: 80px;
      resize: vertical;
    }
    .form-btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .form-btn-group button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }
    .submit-btn {
      background: var(--btn-active);
      color: #fff;
    }
    .cancel-btn {
      background: var(--border-color);
      color: var(--text-main);
    }
    .tip {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-sub);
    }
    /* 提示弹窗 */
    .msg-box {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%,-50%);
      padding: 12px 24px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      border-radius: 8px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
<h1>我的友情链接</h1>

<!-- 工具栏 -->
<div class="tool-bar">
  <button id="themeToggle">切换明暗主题</button>
  <button class="mode-btn active" data-mode="grid">
    <span class="mode-icon icon-grid"></span>网格
  </button>
  <button class="mode-btn" data-mode="list">
    <span class="mode-icon icon-list"></span>列表
  </button>
  <button class="mode-btn" data-mode="compact">
    <span class="mode-icon icon-compact"></span>紧凑
  </button>
</div>

<!-- 自助申请友链按钮 -->
<button class="apply-btn" id="openApply">🔗 自助申请友链</button>

<!-- 友链列表 -->
<div class="link-wrap grid" id="container"></div>

<!-- 分页 -->
<div class="pagination" id="pageBox"></div>

<!-- 申请友链弹窗 -->
<div class="mask" id="mask">
  <div class="apply-box">
    <h2>🔗 申请友情链接</h2>
    <div class="form-item">
      <label>网站名称 *</label>
      <input type="text" id="siteName" placeholder="例如：My Blog">
    </div>
    <div class="form-item">
      <label>网站链接 *</label>
      <input type="url" id="siteUrl" placeholder="https://example.com">
    </div>
    <div class="form-item">
      <label>友链页面 URL *</label>
      <input type="url" id="friend_url" placeholder="https://example.com/friends">
    </div>
    <div class="form-item">
      <label>头像/Logo地址 *</label>
      <input type="url" id="siteAvatar" placeholder="图片直链地址">
    </div>
    <div class="form-item">
      <label>网站描述</label>
      <textarea id="siteDesc" placeholder="简短描述你的网站（一句话即可）"></textarea>
    </div>
    <div class="form-btn-group">
      <button class="cancel-btn" id="closeApply">取消</button>
      <button class="submit-btn" id="submitApply">提交申请</button>
    </div>
    <p class="tip">提交后跳转 GitHub Issue，管理员将在此审核友链</p>
  </div>
</div>

<!-- 消息提示 -->
<div class="msg-box" id="msgBox"></div>

<script>
// 分页配置
const PAGE_SIZE = 12;
let currentPage = 1;
let allLinkList = [];
// 目标仓库：yzg011 / Link
const GITHUB_REPO_OWNER = "yzg011";
const GITHUB_REPO_NAME = "Link";
// GitHub 新建 Issue 基础链接
const ISSUE_BASE_URL = `https://github.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/issues/new`;

const container = document.getElementById('container');
const pageBox = document.getElementById('pageBox');
const htmlRoot = document.documentElement;
const mask = document.getElementById('mask');
const msgBox = document.getElementById('msgBox');

// ========== 明暗主题 ==========
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (!htmlRoot.classList.contains('dark')) {
    htmlRoot.classList.toggle('dark', e.matches);
  }
});
document.getElementById('themeToggle').addEventListener('click', () => {
  htmlRoot.classList.toggle('dark');
});

// ========== 布局模式切换 ==========
const modeBtns = document.querySelectorAll('.mode-btn');
modeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    modeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    container.className = `link-wrap ${btn.dataset.mode}`;
  });
});

// ========== 消息提示函数 ==========
function showMsg(text, time = 2000) {
  msgBox.innerText = text;
  msgBox.style.display = 'block';
  setTimeout(() => {
    msgBox.style.display = 'none';
  }, time);
}

// ========== 友链弹窗控制 ==========
document.getElementById('openApply').addEventListener('click', () => {
  mask.style.display = 'flex';
});
document.getElementById('closeApply').addEventListener('click', () => {
  mask.style.display = 'none';
});
// 点击遮罩关闭
mask.addEventListener('click', e => {
  if(e.target === mask) mask.style.display = 'none';
});

// ========== 表单提交 → 跳转 GitHub Issue 并按模板格式填充数据 ==========
document.getElementById('submitApply').addEventListener('click', () => {
  const name = document.getElementById('siteName').value.trim();
  const url = document.getElementById('siteUrl').value.trim();
  const friend_url = document.getElementById('friend_url').value.trim();
  const avatar = document.getElementById('siteAvatar').value.trim();
  const desc = document.getElementById('siteDesc').value.trim();

  // 前端表单校验（匹配模板必填项）
  if(!name || !url || !friend_url || !avatar){
    showMsg('请填写完整必填信息');
    return;
  }
  if(!/^https?:\/\//.test(url) || !/^https?:\/\//.test(friend_url)){
    showMsg('请输入有效的网站链接和友链页面链接');
    return;
  }

  // 关键：按仓库模板的字段名来生成 Issue 正文
  const issueTitle = `友链申请：${name}`;
  const issueBody = `
### 网站名称
    ${name}
### 网站链接
    ${url}
### 网站头像 URL
    ${avatar}
### 网站描述
    ${desc}
### 友链页面 URL
    ${friend_url}
  `.trim();

  // 拼接 URL 参数，自动填充 GitHub Issue 标题和正文
  const jumpUrl = `${ISSUE_BASE_URL}?title=${encodeURIComponent(issueTitle)}&body=${encodeURIComponent(issueBody)}`;

  // 新标签页跳转至 GitHub Issue 页面
  window.open(jumpUrl, '_blank');

  // 清空表单、关闭弹窗
  document.getElementById('siteName').value = '';
  document.getElementById('siteUrl').value = '';
  document.getElementById('friend_url').value = '';
  document.getElementById('siteAvatar').value = '';
  document.getElementById('siteDesc').value = '';
  mask.style.display = 'none';
  showMsg('已跳转至 GitHub 提交申请');
});

// ========== 渲染列表与分页 + 点击卡片跳转链接 ==========
function renderPageData(page) {
  const start = (page - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageData = allLinkList.slice(start, end);

  let htmlStr = '';
  pageData.forEach(item => {
    // 给卡片绑定 data-url 存储链接地址
    htmlStr += `
      <div class="link-card" data-url="${item.url}">
        <img class="avatar" src="${item.avatar}" alt="${item.name}头像">
        <div class="info">
          <h3><a href="${item.url}" target="_blank">${item.name}</a></h3>
          <p>${item.description}</p>
        </div>
      </div>
    `;
  });
  container.innerHTML = htmlStr;

  // 绑定点击事件：点击整个友链框跳转链接（新标签页打开）
  document.querySelectorAll('.link-card').forEach(card => {
    card.addEventListener('click', (e) => {
      // 排除内部a标签的点击，避免重复跳转
      if (e.target.tagName === 'A') return;
      // 新标签页打开链接，如需当前页打开，替换为 window.location.href = card.dataset.url;
      window.open(card.dataset.url, '_blank');
    });
  });
}

function renderPagination() {
  const totalPage = Math.ceil(allLinkList.length / PAGE_SIZE);
  let pageHtml = '';
  for (let i = 1; i <= totalPage; i++) {
    pageHtml += `
      <button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>
    `;
  }
  pageBox.innerHTML = pageHtml;

  document.querySelectorAll('.page-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPage = Number(btn.dataset.page);
      renderPageData(currentPage);
      renderPagination();
      window.scrollTo(0, 0);
    });
  });
}

// ========== 加载JSON数据初始化 ==========
fetch('./friends.json')
.then(res => res.json())
.then(list => {
  allLinkList = list;
  renderPageData(currentPage);
  renderPagination();
})
.catch(err => {
  container.innerHTML = '友链数据加载失败，请检查 friends.json 文件路径';
  console.error(err);
})
</script>
</body>
</html>
